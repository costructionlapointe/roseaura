<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · RoseAura</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="admin.css"><script src="../cms-config.js" defer></script><script src="admin.js" defer></script></head>
<body><header><a href="../">RoseAura</a><span id="role"></span><button id="logout" hidden>Déconnexion</button></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="login"><h1>Administration</h1><form id="loginForm"><label>Courriel<input name="email" type="email" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required minlength="12"></label><button>Se connecter</button></form></section>
<section id="workspace" hidden><div class="toolbar"><h1>Contenu du site</h1><button id="save">Enregistrer le brouillon</button><button id="preview">Aperçu</button><button id="publish" disabled>Publier</button><button id="passwordChange">Mon mot de passe</button></div><p>Les brouillons restent privés. Une sauvegarde est conservée avant chaque modification enregistrée.</p>
<nav id="tabs" aria-label="Sections de gestion"><button data-tab="texts">Textes et ressources</button><button data-tab="images">Photos</button><button data-tab="products">Produits et promotions</button><button data-tab="categories">Catégories</button><button data-tab="articles">Articles</button><button data-tab="history" id="historyTab" hidden>Historique</button><button data-tab="accounts" id="accountsTab" hidden>Accès</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="Rechercher dans le contenu" aria-label="Rechercher"><button id="add" hidden>Ajouter</button></div><div id="editor"></div></section>
<dialog id="previewDialog"><div class="toolbar"><h2>Aperçu du brouillon</h2><button id="closePreview">Fermer</button></div><p>Vérifiez les textes, photos et prix avant publication.</p><iframe id="previewFrame" title="Aperçu du site RoseAura"></iframe></dialog>
<dialog id="passwordDialog"><h2>Changer mon mot de passe</h2><form id="passwordForm"><label>Nouveau mot de passe<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button>Enregistrer</button><button type="button" id="closePassword">Annuler</button></form></dialog>
<iframe id="sourceFrame" src="../?cms-preview=1" title="Chargement du contenu initial" hidden></iframe>
</main></body></html>
